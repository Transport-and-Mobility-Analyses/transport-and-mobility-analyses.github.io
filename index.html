    try{sessionStorage.setItem('gp_ad',ad);sessionStorage.setItem('gp_cfg',JSON.stringify({u:CFG.u,k:CFG.k}));sessionStorage.setItem('gp_k_'+CFG.s,k);}catch(e){}
    m.textContent='Açılıyor…';return ac(k);
  }).catch(function(e){b.disabled=false;m.className='msj';m.textContent=e&&e.message==='tarayici'?'Tarayıcınız desteklenmiyor; Chrome, Edge, Firefox veya Safari\'nin güncel sürümünü kullanın.':'Sunucuya ulaşılamadı. Biraz sonra tekrar deneyin.';});
};
document.getElementById('ad').focus();
})();
